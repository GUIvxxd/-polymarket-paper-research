[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-paper-research"
version = "0.1.0"
description = "Paper-only Polymarket research, evidence collection, and deterministic replay tools."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "requests==2.34.2",
  "websockets==15.0.1",
  "openpyxl==3.1.5",
  "zstandard==0.23.0",
]

[project.optional-dependencies]
test = [
  "hypothesis==6.156.7",
]

[tool.setuptools]
packages = ["both_sides_spike"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["data", "reports", "repos"]
